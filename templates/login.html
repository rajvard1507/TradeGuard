{% extends "base.html" %}
{% block content %}
<section class="panel">
<h2>Login</h2>
<form method="post">
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button type="submit">Login</button>
</form>
<p>New trader? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
