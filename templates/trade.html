{% extends "base.html" %}
{% block content %}
<section class="panel">
<h2>Place a trade</h2>
<form method="post">
<label>Stock<select name="stock_id" required>{% for s in stocks %}<option value="{{ s.stock_id }}">{{ s.ticker_symbol }} — {{ s.company_name }} ({{ s.current_price }})</option>{% endfor %}</select></label>
<label>Trade type<select name="trade_type"><option value="BUY">BUY</option><option value="SELL">SELL</option></select></label>
<label>Quantity<input type="number" name="quantity" min="1" step="1" required></label>
<label>Leverage ratio<input type="number" name="leverage_ratio" min="1" step="0.1" value="1" required></label>
<button type="submit">Submit trade</button>
</form>
<p>The database validates the trade and creates risk alerts. This demo does not block a trade solely because a behavioral alert fires.</p>
</section>
{% endblock %}
